name: Deploy Hanami High

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify portal source is current
        run: |
          test -f app/portal/PortalAuthPanel.tsx
          test -f app/portal/RolePortalClient.tsx
          test -f app/portal/student/page.tsx
          test -f app/portal/faculty/page.tsx
          test -f app/portal/SchedulePanel.tsx
          test -f app/portal/CourseworkPanel.tsx
          test -f app/portal/StudentActivitiesPanel.tsx
          test -f app/portal/FacultyCourseManager.tsx
          test -f app/portal/FacultyGradingPanel.tsx
          test -f app/portal/FacultyAdvisingPanel.tsx
          test -f app/portal/InboxPanel.tsx
          grep -q 'auth/v1/authorize' app/portal/PortalAuthPanel.tsx
          grep -q 'Enter Student Portal' app/portal/PortalAuthPanel.tsx
          grep -q 'Enter Faculty Portal' app/portal/PortalAuthPanel.tsx
          grep -q 'hanami.portal.character.v1' app/portal/RolePortalClient.tsx
          grep -q 'section_memberships' app/portal/SchedulePanel.tsx
          grep -q 'Submit assignment' app/portal/CourseworkPanel.tsx
          grep -q 'Activities & events' app/portal/StudentActivitiesPanel.tsx
          grep -q 'Create assignment' app/portal/FacultyCourseManager.tsx
          grep -q 'Return graded work' app/portal/FacultyGradingPanel.tsx
          grep -q 'Advising roster' app/portal/FacultyAdvisingPanel.tsx
          grep -q 'HANAMI MESSAGES' app/portal/InboxPanel.tsx
          grep -q 'start_direct_conversation' app/portal/InboxPanel.tsx
          grep -q 'start_group_conversation' app/portal/InboxPanel.tsx
          grep -q 'Create group' app/portal/InboxPanel.tsx
          if grep -R -q 'Continue with Discord — setup pending' app; then
            echo 'Stale portal setup-pending UI is still present.'
            exit 1
          fi
          if grep -R -q 'Module coming next' app/portal; then
            echo 'A role portal placeholder remains in source.'
            exit 1
          fi
      - run: npm run build
      - name: Verify exported portal artifact
        if: github.event_name != 'pull_request'
        run: |
          test -f out/portal/index.html
          test -f out/portal/student/index.html
          test -f out/portal/faculty/index.html
          if grep -R -q 'Continue with Discord — setup pending' out; then
            echo 'Stale portal markup reached the Pages artifact.'
            exit 1
          fi
          grep -R -q 'LIVE DASHBOARD' out || {
            echo 'Live dashboard client bundle is missing from the Pages artifact.'
            exit 1
          }
          grep -R -q 'HANAMI MESSAGES' out || {
            echo 'Hanami Inbox client bundle is missing from the Pages artifact.'
            exit 1
          }
          grep -R -q 'Create group' out || {
            echo 'Hanami group chat controls are missing from the Pages artifact.'
            exit 1
          }
          grep -R -q 'Activities & events' out || {
            echo 'Student Activities client bundle is missing from the Pages artifact.'
            exit 1
          }
          grep -R -q 'Advising roster' out || {
            echo 'Faculty Advising client bundle is missing from the Pages artifact.'
            exit 1
          }
          grep -R -q 'Student Portal' out/portal/student || {
            echo 'Student portal export is missing.'
            exit 1
          }
          grep -R -q 'Faculty Portal' out/portal/faculty || {
            echo 'Faculty portal export is missing.'
            exit 1
          }
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
