name: Final Hanami CI Probe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run final verification and record result
        shell: bash
        run: |
          set +e
          LOG=/tmp/hanami-final-ci.log
          CODE=0

          run_check() {
            local label="$1"
            shift
            echo "=== $label ===" >>"$LOG"
            "$@" >>"$LOG" 2>&1
            local status=$?
            if [ "$status" -ne 0 ] && [ "$CODE" -eq 0 ]; then CODE="$status"; fi
            return 0
          }

          : >"$LOG"
          run_check "npm ci" npm ci
          run_check "production audit" npm audit --omit=dev --audit-level=high
          run_check "lint" npm run lint
          run_check "typecheck" npm run typecheck
          run_check "tests" npm test
          run_check "build" npm run build

          echo '=== routes ===' >>"$LOG"
          for route in \
            out/index.html \
            out/about/index.html \
            out/academics/index.html \
            out/apply/index.html \
            out/calendar/index.html \
            out/campus-life/index.html \
            out/changelog/index.html \
            out/elections/index.html \
            out/homeroom/index.html \
            out/organizations/index.html \
            out/portal/index.html \
            out/portal/admin/index.html \
            out/portal/city/index.html \
            out/portal/faculty/index.html \
            out/portal/help/index.html \
            out/portal/lore/index.html \
            out/portal/owner/index.html \
            out/portal/owner/student-viewer/index.html \
            out/portal/roadmap/index.html \
            out/portal/student/index.html \
            out/portal/student/class/index.html \
            out/rooms/index.html \
            out/rules/index.html \
            out/sports/index.html \
            out/traditions/index.html \
            out/updates/index.html; do
            if [ ! -f "$route" ]; then
              echo "MISSING ROUTE: $route" >>"$LOG"
              [ "$CODE" -eq 0 ] && CODE=1
            fi
          done

          {
            if [ "$CODE" -eq 0 ]; then echo 'HANAMI_FINAL_CI=PASS'; else echo 'HANAMI_FINAL_CI=FAIL'; fi
            echo "exit_code=$CODE"
            echo '--- lint ---'
            awk '/^=== lint ===$/{capture=1;next}/^=== typecheck ===$/{capture=0}capture' "$LOG" | tail -n 180 || true
            echo '--- failing checks ---'
            grep -E '^not ok|AssertionError|ERR_ASSERTION|MISSING ROUTE|npm ERR!|found [1-9][0-9]* vulnerabilities' "$LOG" | tail -n 120 || true
            echo '--- test summary ---'
            grep -E '^# (tests|pass|fail|cancelled|skipped|todo) ' "$LOG" | tail -n 8 || true
            echo '--- tail ---'
            tail -n 180 "$LOG"
          } > final-ci-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-ci-result.txt
          git commit -m "Record final Hanami CI probe result" || true
          git push || true
          exit "$CODE"
