name: Final Hanami CI Probe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run final verification and record result
        shell: bash
        run: |
          set +e
          LOG=/tmp/hanami-final-ci.log
          {
            echo '=== npm ci ==='
            npm ci
            echo '=== production audit ==='
            npm audit --omit=dev --audit-level=high
            echo '=== typecheck ==='
            npm run typecheck
            echo '=== tests ==='
            npm test
            echo '=== build ==='
            npm run build
            echo '=== routes ==='
            test -f out/index.html
            test -f out/calendar/index.html
            test -f out/portal/index.html
            test -f out/portal/student/index.html
            test -f out/portal/faculty/index.html
            test -f out/portal/admin/index.html
            test -f out/portal/owner/index.html
          } >"$LOG" 2>&1
          CODE=$?
          {
            if [ "$CODE" -eq 0 ]; then echo 'HANAMI_FINAL_CI=PASS'; else echo 'HANAMI_FINAL_CI=FAIL'; fi
            echo "exit_code=$CODE"
            echo '--- tail ---'
            tail -n 120 "$LOG"
          } > final-ci-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-ci-result.txt
          git commit -m "Record final Hanami CI probe result"
          git push
